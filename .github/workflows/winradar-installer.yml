name: WinRadar installer

on:
  pull_request:
    paths: ["winradar/**", ".github/workflows/winradar-installer.yml"]
  push:
    branches: [main]
    paths: ["winradar/**", ".github/workflows/winradar-installer.yml"]
    tags: ["winradar-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: winradar
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"   # Chromium tải vào trong gói playwright để PyInstaller đóng gói kèm
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m playwright install --no-shell chromium

      - name: Run tests (including a real Chromium scan of a fake Ad Library)
        env:
          WINRADAR_E2E: "1"
        run: python -m pytest -v

      - name: Build WinRadar.exe
        run: pyinstaller --noconfirm packaging/winradar.spec

      - name: Self-test the packaged app
        run: |
          dist\WinRadar\WinRadar.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = if ($env:GITHUB_REF -like "refs/tags/winradar-v*") { $env:GITHUB_REF_NAME -replace '^winradar-v','' } else { "0.0.${{ github.run_number }}" }
          iscc "/DAppVersion=$version" packaging\winradar.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: WinRadar-Setup
          path: winradar/Output/WinRadar-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/winradar-v')
        uses: softprops/action-gh-release@v2
        with:
          files: winradar/Output/WinRadar-Setup.exe
