name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  engine:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: richtube-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: richtube-engine/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: richtube-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: richtube-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  chrome:
    name: Chrome extension (test + zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
        working-directory: richtube-chrome
      - name: Đóng gói tiện ích
        run: |
          mkdir -p dist/richtube-chrome
          cd richtube-chrome
          cp -r manifest.json background.js content.js content.css sidepanel.html sidepanel.js \
            options.html options.js panel.css README.md lib icons ../dist/richtube-chrome/
      - uses: actions/upload-artifact@v4
        with:
          name: richtube-chrome
          path: dist/

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp richtube-engine/.env.example richtube-engine/.env
      - run: docker compose build
