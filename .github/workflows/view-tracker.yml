# Runs the Reels & YouTube view tracker on GitHub's servers every 30 minutes,
# so no computer has to stay on. Setup guide: reels_tracker/README.md ("Cách D").
name: View tracker

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "7,37 * * * *"
  # "Run workflow" button in the Actions tab, for testing.
  workflow_dispatch:

# Never run two scans at once; they share the saved data.
concurrency:
  group: view-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reels_tracker
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
      YT_CHANNELS: ${{ vars.YT_CHANNELS }}
      FB_PAGE_IDS: ${{ vars.FB_PAGE_IDS }}
      VIEW_THRESHOLD: ${{ vars.VIEW_THRESHOLD }}
      DB_PATH: data/reels_tracker.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reels_tracker/requirements.txt

      - run: pip install -r requirements.txt

      # The database (tracked channels, settings, view history) is carried from
      # one run to the next in the Actions cache; the newest copy is restored.
      - name: Restore saved data
        uses: actions/cache/restore@v4
        with:
          path: reels_tracker/data
          key: tracker-data-${{ github.run_id }}
          restore-keys: tracker-data-

      - name: Handle Telegram commands, scan and report
        run: python tracker.py --cron

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reels_tracker/data
          key: tracker-data-${{ github.run_id }}-${{ github.run_attempt }}
