<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SNAKEMEDIA POD</title>
<link rel="stylesheet" href="style.css">
<style>
  body{display:block;width:340px;min-height:0;margin:0}
  .top{display:flex;gap:10px;align-items:center;padding:14px;background:linear-gradient(180deg,var(--side),var(--side-2));color:#fff}
  .top img{width:36px;height:36px;border-radius:10px}
  .top b{letter-spacing:.06em}
  .top small{display:block;color:var(--side-muted);font-size:11px}
  .wrap{padding:12px 14px 14px}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .nums a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;color:var(--text)}
  .nums b{display:block;font-size:20px}
  .nums small{color:var(--muted);font-size:11px}
  form{display:flex;gap:6px;margin:0 0 10px}
  form input{flex:1;min-width:0}
  #status{font-size:12px;color:var(--muted);margin:0 0 10px;min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt=""><div><b>SNAKEMEDIA</b> <span class="chip" style="background:var(--lime);color:var(--navy)">POD</span>
  <small>Spy QC · Viral · POD · US</small></div></div>
<div class="wrap">
  <div class="nums">
    <a href="dashboard.html#sap_win" target="_blank"><b id="n-sap">–</b><small>Sắp WIN</small></a>
    <a href="dashboard.html#win" target="_blank"><b id="n-win">–</b><small>Video Win</small></a>
    <a href="dashboard.html#viral" target="_blank"><b id="n-viral">–</b><small>Viral</small></a>
  </div>
  <p id="status">…</p>
  <form id="scan"><input name="keyword" placeholder="Quét từ khoá, vd: nurse mug" required><button class="primary small">Quét</button></form>
  <div class="row2">
    <label class="note"><input type="checkbox" id="passive"> Tự lưu khi lướt</label>
    <button class="small primary" id="open">Mở bảng điều khiển</button>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
